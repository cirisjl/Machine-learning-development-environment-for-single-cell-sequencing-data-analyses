apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      containers:
        - name: directus
          image: directus/directus:9.24.0
          envFrom:
            - configMapRef:
                name: oscb-config
            - secretRef:
                name: oscb-secret
          ports:
            - containerPort: 8055
          volumeMounts:
            - name: directus-uploads
              mountPath: /directus/uploads
      volumes:
        - name: directus-uploads
          hostPath:
            path: /ps/code/oscb/Directus_uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: directus
  namespace: oscb
spec:
  type: NodePort
  selector:
    app: directus
  ports:
    - protocol: TCP
      port: 8055
      targetPort: 8055
      nodePort: 30055
