apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          command: ["mongod", "--port", "65530"]
          ports:
            - containerPort: 65530
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: initmongo-js
              mountPath: /docker-entrypoint-initdb.d/initMongo.js
              subPath: initMongo.js
      volumes:
        - name: mongodb-data
          hostPath:
            path: /ps/code/oscb/db/mongodb
            type: DirectoryOrCreate
        - name: initmongo-js
          configMap:
            name: initmongo-js
---
apiVersion: v1
kind: Service
metadata:
  name: oscbdb
  namespace: oscb
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 65530
      targetPort: 65530
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: "oscbdb"
            - name: ME_CONFIG_MONGODB_PORT
              value: "65530"
            - name: ME_CONFIG_BASICAUTH
              value: "true"
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oscb-secret
                  key: ME_CONFIG_BASICAUTH_USERNAME
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oscb-secret
                  key: ME_CONFIG_BASICAUTH_PASSWORD
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: oscb
spec:
  type: NodePort
  selector:
    app: mongo-express
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081
