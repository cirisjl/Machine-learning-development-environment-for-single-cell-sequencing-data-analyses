apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscb-node
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oscb-node
  template:
    metadata:
      labels:
        app: oscb-node
    spec:
      containers:
        - name: node
          image: oscb-node:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: oscb-config
            - secretRef:
                name: oscb-secret
          ports:
            - containerPort: 3001
            - containerPort: 3020
          volumeMounts:
            - name: user-storage
              mountPath: /usr/src/app/storage/
      volumes:
        - name: user-storage
          persistentVolumeClaim:
            claimName: oscb-user-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-node
  namespace: oscb
spec:
  type: NodePort
  selector:
    app: oscb-node
  ports:
    - name: port1
      protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30001
    - name: port2
      protocol: TCP
      port: 3020
      targetPort: 3020
      nodePort: 30020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscb-react
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oscb-react
  template:
    metadata:
      labels:
        app: oscb-react
    spec:
      containers:
        - name: react
          image: oscb-react:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: oscb-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-react
  namespace: oscb
spec:
  type: NodePort
  selector:
    app: oscb-react
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
