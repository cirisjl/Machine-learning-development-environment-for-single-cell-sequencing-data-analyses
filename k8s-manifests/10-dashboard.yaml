apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscb-dashboard
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oscb-dashboard
  template:
    metadata:
      labels:
        app: oscb-dashboard
    spec:
      containers:
        - name: flower
          image: oscb-api:latest
          imagePullPolicy: Never
          command: ["celery", "--app", "main.celery", "flower", "--port=5555", "--broker=amqp://admin:eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81@oscb-rabbitmq:5673//", "--basic-auth=admin:eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"]
          envFrom:
            - configMapRef:
                name: oscb-config
            - secretRef:
                name: oscb-secret
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-dashboard
  namespace: oscb
spec:
  type: NodePort
  selector:
    app: oscb-dashboard
  ports:
    - protocol: TCP
      port: 5558
      targetPort: 5555
      nodePort: 30558
