apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oscb-mysql-pvc
  namespace: oscb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscb-mysql
  namespace: oscb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oscb-mysql
  template:
    metadata:
      labels:
        app: oscb-mysql
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/mysql"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: mysql
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - "mysqld"
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-authentication-plugin=mysql_native_password"
          envFrom:
            - configMapRef:
                name: oscb-config
            - secretRef:
                name: oscb-secret
          ports:
            - containerPort: 3308
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: oscb-schema-sql
              mountPath: /docker-entrypoint-initdb.d/oscb_schema_latest.sql
              subPath: oscb_schema_latest.sql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: oscb-mysql-pvc
        - name: oscb-schema-sql
          configMap:
            name: oscb-schema-sql
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-mysql
  namespace: oscb
spec:
  selector:
    app: oscb-mysql
  ports:
    - protocol: TCP
      port: 3308
      targetPort: 3308
