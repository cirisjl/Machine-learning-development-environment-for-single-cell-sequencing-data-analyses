services:
  mongodb:
    container_name: oscbdb
    image: mongo:7.0  
    restart: always
    command: mongod --port 65530
    ports:
      - 65530:65530
    volumes:
      - /ps/code/oscb/db/mongodb:/data/db
      - ./initMongo.js:/docker-entrypoint-initdb.d/initMongo.js
    networks:
      - oscb-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "65530", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: oscbdb
      ME_CONFIG_MONGODB_PORT: "65530"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD_FILE: "/run/secrets/mongo_express_password"
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - oscb-network
    secrets:
      - mongo_express_password

  oscb_redis:
    image: "redis:6-alpine"
    container_name: oscb_redis 
    hostname: oscb_redis
    restart: always
    command: sh -c 'redis-server --port 6388 --save 20 1 --loglevel warning --requirepass "$$(cat /run/secrets/redis_password)"'
    ports:
      - 6388:6388
    networks:
      - oscb-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6388 -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - redis_password

  oscb_rabbitmq:
    image: "rabbitmq:management"
    container_name: oscb_rabbitmq 
    restart: always
    ports:
      - 5673:5673
      - 15673:15672
    env_file:
      - mu.env 
    volumes:
      - /ps/code/oscb/db/rabbitmq/data/:/var/lib/rabbitmq/
      - /ps/code/oscb/db/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - oscb-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    secrets:
      - rabbitmq_password

  celery-api:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: oscb_celery_api
    command: python3 main.py
    restart: always
    ports:
      - 5005:5005
    volumes:
      - /ps/code/oscb/results:/data/results
      - /ps/code/oscb/uploads:/data/upload
      - /ps/code/oscb/logs:/data/logs
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    networks:
      - oscb-network
    env_file:
      - mu.env
    depends_on:
      mongodb:
        condition: service_healthy
      oscb_redis:
        condition: service_healthy
      oscb_rabbitmq:
        condition: service_healthy
    secrets:
      - rabbitmq_password
      - redis_password

  worker1:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: oscb_worker1
    restart: always
    command: celery -A main.celery worker --loglevel=info -Q tools,benchmarks,workflows,web --max-tasks-per-child=50 --max-memory-per-child=200000000
    env_file:
      - mu.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /ps/code/oscb/results:/data/results
      - /ps/code/oscb/uploads:/data/upload
      - /ps/code/oscb/logs:/data/logs
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    networks:
      - oscb-network
    depends_on:
      mongodb:
        condition: service_healthy
      oscb_redis:
        condition: service_healthy
      oscb_rabbitmq:
        condition: service_healthy
      celery-api:
        condition: service_started
    secrets:
      - rabbitmq_password
      - redis_password

  worker2:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: oscb_worker2
    restart: always
    command: celery -A main.celery worker --loglevel=info -Q tools,benchmarks,workflows,web --max-tasks-per-child=50 --max-memory-per-child=200000000
    env_file:
      - mu.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /ps/code/oscb/results:/data/results
      - /ps/code/oscb/uploads:/data/upload
      - /ps/code/oscb/logs:/data/logs
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    networks:
      - oscb-network
    depends_on:
      mongodb:
        condition: service_healthy
      oscb_redis:
        condition: service_healthy
      oscb_rabbitmq:
        condition: service_healthy
      celery-api:
        condition: service_started
    secrets:
      - rabbitmq_password
      - redis_password

  worker3:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: oscb_worker3
    restart: always
    command: celery -A main.celery worker --loglevel=info -Q tools,benchmarks,workflows,web --max-tasks-per-child=50 --max-memory-per-child=200000000
    env_file:
      - mu.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /ps/code/oscb/results:/data/results
      - /ps/code/oscb/uploads:/data/upload
      - /ps/code/oscb/logs:/data/logs
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    networks:
      - oscb-network
    depends_on:
      mongodb:
        condition: service_healthy
      oscb_redis:
        condition: service_healthy
      oscb_rabbitmq:
        condition: service_healthy
      celery-api:
        condition: service_started
    secrets:
      - rabbitmq_password
      - redis_password

  dashboard:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: oscb_dashboard
    restart: always
    command: sh -c 'celery --app main.celery flower --port=5555 --broker="amqp://admin:$$(cat /run/secrets/rabbitmq_password)@oscb_rabbitmq:5673//" --basic-auth="admin:$$(cat /run/secrets/rabbitmq_password)"'
    ports:
      - 5558:5555
    env_file:
      - mu.env
    depends_on:
      celery-api:
        condition: service_started
      oscb_rabbitmq:
        condition: service_healthy
      oscb_redis:
        condition: service_healthy
    networks:
      - oscb-network
    secrets:
      - rabbitmq_password

  oscb_mysql:
    container_name: oscb_mysql
    image: mysql:8.0
    build:
      context: ./oscb-ui/oscb-mysql
    volumes:
      - /ps/code/oscb/mysql_db:/var/lib/mysql
      - ./oscb-ui/oscb-mysql/oscb_schema_latest.sql:/docker-entrypoint-initdb.d/oscb_schema_latest.sql
    restart: unless-stopped
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=mysql_native_password",
      ]
    env_file:
      - mu.env 
    ports:
      - 3308:3308  
    networks:
      - oscb-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/mysql_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    secrets:
      - mysql_password

  oscb_node:
    container_name: oscb_node
    image: oscb_node
    build:
      context: ./oscb-ui/oscb-node
    restart: always
    ports:
      - "3001:3001"
      - "3020:3020"
    environment:
      - EXTERNAL_PORT=3001
      - DBUSER=root
      - DATABASE=oscb
      - HOST=oscb_mysql 
      - HOST_URL=c240g5-110219.wisc.cloudlab.us
      - SSH_CONNECTION=${SSH_CONNECTION}
      - DBPASSWORD_FILE=/run/secrets/mysql_password
    env_file:
      - mu.env  
    depends_on:
      oscb_mysql:
        condition: service_healthy
    volumes:
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    networks:
      - oscb-network
    secrets:
      - mysql_password

  oscb_react:
    container_name: oscb_react
    restart: always
    build: ./oscb-ui/oscb-react
    ports:
      - "3000:3000"
    depends_on:
      oscb_node:
        condition: service_started
    environment:
      - HOST_URL=c240g5-110219.wisc.cloudlab.us
    networks:
      - oscb-network

  directus:
    container_name: oscb_directus
    image: directus/directus:9.24.0
    restart: unless-stopped
    ports:
      - 8055:8055
    volumes:
      - /ps/code/oscb/Directus_uploads:/directus/uploads
    depends_on:
      oscb_mysql:
        condition: service_healthy
    env_file:
      - mu.env
    environment:
      DB_PASSWORD_FILE: /run/secrets/mysql_password
    networks:
      - oscb-network
    secrets:
      - mysql_password

  jupyter:
    image: stormgod/oscb-cuda126-r45-seurat440:1.2.1
    container_name: jupyter
    working_dir: /ps
    command: sh -c 'jupyter lab --ip=0.0.0.0 --no-browser --allow-root --ServerApp.iopub_data_rate_limit=10000000000 --ServerApp.token="$$(cat /run/secrets/jupyter_token | tr -d '"'"'\n'"'"')"'
    restart: always
    ports:
      - "8888:8888"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
    networks:
      - oscb-network
    volumes:
      - /ps/code/:/ps/
      - /ps/code/oscb/results:/data/results
      - /ps/code/oscb/uploads:/data/upload
      - /ps/code/oscb/logs:/data/logs
      - /ps/code/oscb/user_storage:/usr/src/app/storage/
    secrets:
      - jupyter_token

networks:
  oscb-network:
    driver: bridge

secrets:
  mongo_express_password:
    file: ./secrets/mongo_express_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  jupyter_token:
    file: ./secrets/jupyter_token.txt